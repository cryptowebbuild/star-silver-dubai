                          <label className="text-[11px] text-silver925-400 block mb-1">Shipping Destination</label>
                          <select 
                            value={orderForm.country}
                            onChange={(e) => setOrderForm({ ...orderForm, country: e.target.value })}
                            className="w-full text-xs p-2.5 rounded-lg border border-noir-700 bg-noir-900 text-white focus:outline-none focus:border-dubaiGold-500"
                          >
                            <option value="UAE (Dubai / Abu Dhabi / Sharjah)">UAE (Local Delivery)</option>
                            <option value="GCC (Saudi Arabia / Qatar / Kuwait / Oman)">GCC Express</option>
                            <option value="USA / Canada (Insured Air Courier)">USA & Canada</option>
                            <option value="United Kingdom & Europe">UK & Europe</option>
                            <option value="Australia & New Zealand">Australia / NZ</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="text-[11px] text-silver925-400 block mb-1">Street Address / City / Postal Code *</label>
                        <textarea 
                          rows="2"
                          required
                          value={orderForm.address}
                          onChange={(e) => setOrderForm({ ...orderForm, address: e.target.value })}
                          placeholder="Villa / Apt #, Street, City, Country..."
                          className="w-full text-xs p-2.5 rounded-lg border border-noir-700 bg-noir-900 text-white focus:outline-none focus:border-dubaiGold-500"
                        ></textarea>
                      </div>
                    </div>
                  </>
                )}
              </div>

              {/* Checkout Trigger */}
              {cart.length > 0 && (
                <div className="p-6 bg-noir-950 border-t border-noir-800 space-y-3">
                  <div className="flex items-center justify-between text-sm">
                    <span className="text-silver925-400">Total Investment:</span>
                    <span className="font-cinzel font-bold text-2xl text-dubaiGold-400">
                      {formatPrice(cartTotal)}
                    </span>
                  </div>

                  <button 
                    onClick={handleWhatsAppOrder}
                    className="w-full bg-[#25D366] hover:bg-[#1ebd5a] text-white font-bold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition"
                  >
                    <i data-lucide="message-circle" className="w-5 h-5"></i>
                    <span>Instant WhatsApp Order (1-Click)</span>
                  </button>

                  <p className="text-[10px] text-gray-500 text-center">
                    🔒 Certified Genuine Gemstones • Insured Worldwide Doorstep Delivery
                  </p>
                </div>
              )}

            </div>
          </div>
        </div>
      )}

      {/* 10. QUICK VIEW MODAL */}
      {quickViewItem && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div onClick={() => setQuickViewItem(null)} className="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>

          <div className="relative bg-noir-900 border border-dubaiGold-500/30 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl z-10 grid grid-cols-1 md:grid-cols-2">
            <div className="relative aspect-[4/5] bg-noir-950">
              <img src={quickViewItem.image} alt={quickViewItem.name} className="w-full h-full object-cover" />
              <div className="absolute top-3 left-3 bg-dubaiGold-500 text-noir-950 text-xs px-2.5 py-1 rounded font-bold font-cinzel">
                {quickViewItem.badge}
              </div>
            </div>

            <div className="p-6 flex flex-col justify-between space-y-4">
              <div>
                <div className="flex items-center justify-between">
                  <span className="text-xs text-dubaiGold-400 font-bold uppercase tracking-wider font-cinzel">{quickViewItem.origin}</span>
                  <button onClick={() => setQuickViewItem(null)} className="text-gray-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <h3 className="font-cinzel font-bold text-xl text-white mt-2">
                  {quickViewItem.name}
                </h3>
                <div className="font-cinzel font-bold text-2xl text-dubaiGold-400 mt-1">
                  {formatPrice(quickViewItem.priceAED)}
                </div>

                <div className="mt-4 space-y-2 text-xs text-silver925-300 border-y border-noir-800 py-3">
                  <div className="flex justify-between">
                    <span className="text-gray-500">Gemstone:</span>
                    <span className="font-semibold text-white">{quickViewItem.gemstone}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-500">Metal:</span>
                    <span className="font-semibold text-white">{quickViewItem.metal}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-500">Crafting:</span>
                    <span className="font-semibold text-white">{quickViewItem.craftsmanship}</span>
                  </div>
                </div>

                <p className="text-xs text-silver925-400 mt-3 leading-relaxed">
                  {quickViewItem.description}
                </p>
              </div>

              <div className="flex gap-3">
                <button 
                  onClick={() => {
                    addToCart(quickViewItem);
                    setQuickViewItem(null);
                  }}
                  className="flex-1 bg-dubaiGold-500 hover:bg-dubaiGold-400 text-noir-950 font-bold py-3 rounded-xl text-xs transition font-cinzel uppercase tracking-wider"
                >
                  Acquire Piece
                </button>
                <a 
                  href={`https://wa.me/971502786062?text=${encodeURIComponent(`Hello Star Silver Stones, I am interested in acquiring ${quickViewItem.name}.`)}`}
                  target="_blank"
                  className="bg-[#25D366] hover:bg-[#1ebd5a] text-white p-3 rounded-xl transition flex items-center justify-center"
                >
                  <i data-lucide="message-circle" className="w-5 h-5"></i>
                </a>
              </div>

            </div>
          </div>
        </div>
      )}

      {/* 11. FOMO TOAST */}
      {showFomo && (
        <div className="fixed bottom-5 left-5 z-40 bg-noir-900/95 backdrop-blur-md border border-dubaiGold-500/40 rounded-xl shadow-2xl p-3.5 max-w-sm flex items-center gap-3.5">
          <div className="w-10 h-10 rounded-full bg-emerald-950 border border-emerald-500/40 flex items-center justify-center text-emerald-400 shrink-0">
            <i data-lucide="check-circle-2" className="w-5 h-5"></i>
          </div>
          <div className="text-xs">
            <div className="font-bold text-white flex items-center gap-1 font-cinzel">
              <span>{LIVE_ORDERS[fomoIndex].name}</span>
              <span className="text-gray-400 font-normal font-sans">({LIVE_ORDERS[fomoIndex].city})</span>
            </div>
            <div className="text-dubaiGold-400 font-medium truncate max-w-[210px]">
              Just acquired: {LIVE_ORDERS[fomoIndex].item}
            </div>
            <div className="text-[10px] text-gray-500 mt-0.5">
              {LIVE_ORDERS[fomoIndex].time} • Verified Dubai Dispatch
            </div>
          </div>
          <button onClick={() => setShowFomo(false)} className="text-gray-500 hover:text-white ml-1">
            <i data-lucide="x" className="w-3.5 h-3.5"></i>
          </button>
        </div>
      )}

      {/* 12. FLOATING WHATSAPP CTA */}
      <a 
        href={BRAND.whatsappUrl} 
        target="_blank"
        rel="noopener noreferrer"
        className="fixed bottom-6 right-6 z-40 bg-[#25D366] hover:bg-[#20ba59] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-all flex items-center justify-center group"
        title="WhatsApp Concierge"
      >
        <i data-lucide="message-circle" className="w-7 h-7"></i>
        <span className="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-300 ease-in-out text-xs font-bold pl-0 group-hover:pl-2">
          WhatsApp Concierge
        </span>
      </a>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
